<script>
'use strict';
// Frequência Zero — prólogo "O Plantão". Brief: brief.md. Falas: falas.js. Valores: config.js.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
let W = 1280, H = 720;          // logical HUD size; the short side is always 720
const PIXEL = true;             // the 3D view is low-res with crisp pixels (PS1 look)
const FONT = 'ui-monospace, "Cascadia Mono", "Courier New", monospace';
const TITLE = 'Frequência Zero — O Plantão';
const CONTROLS = FALAS.controles; // shown on the title screen
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap'; // a headless shot or check: 3D draws cheap; players never see it
let seed;
/** Gameplay random: mulberry32, seeded. Never Math.random. */
function rng() {
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
/** Visual-only random (static, rain streaks): its own stream, so it never shifts gameplay. */
let vseed = 777;
function vr() { vseed = (Math.imul(vseed, 1103515245) + 12345) >>> 0; return vseed / 4294967296; }
function seeded(s) { return () => { s = (s * 16807) % 2147483647; return s / 2147483647; }; }
const events = []; // window.game.events: anything the game wants a run to see
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const pad = n => String(n).padStart(2, '0');

// ---- Screen: HUD canvas at full resolution, 3D canvas at PS1 resolution ---------------------
const hud = document.getElementById('game');
const ctx = hud.getContext('2d');
const view = document.getElementById('view');
let K = 1, LW = 320, LH = 180;
function fit() { // fills the window at any size and pixel ratio
  const iw = innerWidth, ih = innerHeight, dpr = devicePixelRatio || 1;
  K = Math.min(iw, ih) / 720; W = iw / K; H = ih / K;
  hud.width = Math.round(iw * dpr); hud.height = Math.round(ih * dpr);
  hud.style.width = iw + 'px'; hud.style.height = ih + 'px';
  ctx.setTransform(K * dpr, 0, 0, K * dpr, 0, 0);
  // PS1 density: the short side keeps 320x180's 180 px in any aspect (a phone in portrait too).
  const S = tune.render_long * 9 / 16 * (CHEAP ? 0.5 : 1);
  if (iw >= ih) { LH = Math.round(S); LW = Math.max(1, Math.round(S * iw / ih)); }
  else { LW = Math.round(S); LH = Math.max(1, Math.round(S * ih / iw)); }
  view.style.width = iw + 'px'; view.style.height = ih + 'px';
  if (gfx) gfx.resize();
}
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center', style = '') {
  ctx.fillStyle = c; ctx.font = `${style}${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
/** Splits s into lines no wider than maxW at the given font. */
function wrap(s, maxW, size, style = '') {
  ctx.font = `${style}${size}px ${FONT}`;
  const out = []; let line = '';
  for (const w of s.split(' ')) {
    const tryL = line ? line + ' ' + w : w;
    if (ctx.measureText(tryL).width > maxW && line) { out.push(line); line = w; } else line = tryL;
  }
  if (line) out.push(line);
  return out;
}

// ---- Input: keys by position (event.code), pointer drags and taps -------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code); // true for one step after the key goes down
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow') || e.code === 'Backspace') e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('blur', () => { down.clear(); ptr.down = false; });
const ptr = { x: -1, y: -1, down: false, sx: 0, sy: 0, lx: 0, ly: 0, moved: false, dx: 0, dy: 0, mouse: false };
const taps = []; // client px, consumed by the step
addEventListener('pointerdown', e => {
  startAudio();
  Object.assign(ptr, { down: true, sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY, x: e.clientX, y: e.clientY, moved: false });
  ptr.mouse = e.pointerType === 'mouse';
});
addEventListener('pointermove', e => {
  ptr.x = e.clientX; ptr.y = e.clientY; ptr.mouse = e.pointerType === 'mouse';
  if (!ptr.down) return;
  const dx = e.clientX - ptr.lx, dy = e.clientY - ptr.ly; ptr.lx = e.clientX; ptr.ly = e.clientY;
  if (Math.hypot(e.clientX - ptr.sx, e.clientY - ptr.sy) > 8) ptr.moved = true;
  if (ptr.moved) { ptr.dx += dx; ptr.dy += dy; }
});
addEventListener('pointerup', e => { if (ptr.down && !ptr.moved) taps.push({ x: e.clientX, y: e.clientY }); ptr.down = false; });
addEventListener('pointercancel', () => { ptr.down = false; });
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('touchmove', e => e.preventDefault(), { passive: false });

// ---- Audio: Web Audio, all procedural; started on first input, mute on M --------------------
let audio = null, muted = false, paused = false;
const snd = { ok: false };
function startAudio() {
  if (!audio) {
    try {
      const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)(); // a check may inject one
      const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
      out.connect(ac.destination); audio = { ac, out };
      buildSound();
    } catch (e) { snd.ok = false; }
  }
  if (audio && audio.ac.state === 'suspended' && audio.ac.resume) audio.ac.resume();
}
function outLevel() { return (muted || paused) ? 0 : tune.volume; }
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = outLevel(); for (const id in vozes) vozes[id].el.muted = m; }
function setPaused(p) { paused = p; if (audio) audio.out.gain.value = outLevel(); for (const id in vozes) { const el = vozes[id].el; if (p) el.pause(); } }
addEventListener('tune', () => setMuted(muted)); // the tweak panel (an add-on), when added, moved a value: the volume follows
function tone(freq, dur, type = 'square', vol = 0.3, dest) {
  if (!snd.ok) return;
  const t = audio.ac.currentTime, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(dest || audio.out); o.start(t); o.stop(t + dur);
}
function noiseBuffer(ac, sec, brown) {
  const n = Math.floor(ac.sampleRate * sec), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  let last = 0;
  for (let i = 0; i < n; i++) { const w = vr() * 2 - 1; if (brown) { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w; }
  return b;
}
function filt(type, f, q) { const n = audio.ac.createBiquadFilter(); n.type = type; n.frequency.value = f; if (q != null) n.Q.value = q; return n; }
function gainNode(v) { const g = audio.ac.createGain(); g.gain.value = v; return g; }
function loopNoise(buf) { const s = audio.ac.createBufferSource(); s.buffer = buf; s.loop = true; s.start(); return s; }
/** Builds the ambience (rain, wind, hum) and the radio bus (static, murmur, breath, distant music). */
function buildSound() {
  const ac = audio.ac;
  snd.white = noiseBuffer(ac, 2, false); snd.brown = noiseBuffer(ac, 3, true);
  snd.amb = gainNode(1); snd.amb.connect(audio.out);
  snd.rainG = gainNode(0); loopNoise(snd.white).connect(filt('lowpass', 1300, 0.4)).connect(snd.rainG).connect(snd.amb);
  snd.patG = gainNode(0); loopNoise(snd.white).connect(filt('highpass', 3800, 0.5)).connect(snd.patG).connect(snd.amb);
  snd.windF = filt('bandpass', 380, 0.9); snd.windG = gainNode(0);
  loopNoise(snd.brown).connect(snd.windF).connect(snd.windG).connect(snd.amb);
  snd.humG = gainNode(0);
  const o1 = ac.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 60;
  const o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = 120;
  o1.connect(filt('lowpass', 220, 0.7)).connect(snd.humG); o2.connect(gainNode(0.6)).connect(snd.humG);
  snd.humG.connect(snd.amb); o1.start(); o2.start();
  snd.radio = gainNode(0.4); snd.radio.connect(audio.out);
  snd.staticG = gainNode(0); loopNoise(snd.white).connect(filt('bandpass', 2600, 0.5)).connect(snd.staticG).connect(snd.radio);
  snd.murF = filt('bandpass', 800, 4); snd.murG = gainNode(0);
  loopNoise(snd.white).connect(snd.murF).connect(snd.murG).connect(snd.radio);
  snd.breathG = gainNode(0); loopNoise(snd.brown).connect(filt('lowpass', 650, 0.7)).connect(snd.breathG).connect(snd.radio);
  snd.musicG = gainNode(0); snd.musicG.connect(filt('lowpass', 1400, 0.7)).connect(snd.radio);
  snd.nextNote = ac.currentTime + 0.2; snd.noteI = 0;
  snd.ok = true;
}
function noiseShot(dur, type, f, q, vol, dest, brown, attack = 0.005) {
  if (!snd.ok) return null;
  const ac = audio.ac, s = ac.createBufferSource(); s.buffer = brown ? snd.brown : snd.white; s.loop = true;
  const fl = filt(type, f, q), g = gainNode(0), t = ac.currentTime;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(fl).connect(g).connect(dest || audio.out); s.start(t, vr()); s.stop(t + dur + 0.05);
  return { fl, t };
}
const sfx = {
  thunder(p) { const r = noiseShot(3.5 + p * 3, 'lowpass', 900, 0.7, 0.6 * p, snd.amb, true, 0.08); if (r) r.fl.frequency.exponentialRampToValueAtTime(110, r.t + 3); },
  click() { noiseShot(0.05, 'highpass', 1800, 0.7, 0.25); tone(140, 0.06, 'square', 0.05); },
  beep() { tone(880, 0.16, 'square', 0.07); },
  alarm() { if (!snd.ok) return; const ac = audio.ac, t = ac.currentTime;
    [[880, 0], [660, 0.2], [880, 0.4], [660, 0.6]].forEach(([f, d]) => { const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'square'; o.frequency.value = f; g.gain.setValueAtTime(0.06, t + d); g.gain.setValueAtTime(0.0001, t + d + 0.17);
      o.connect(g).connect(audio.out); o.start(t + d); o.stop(t + d + 0.18); }); },
  drawer() { const r = noiseShot(0.45, 'bandpass', 500, 2, 0.25, null, true, 0.05); if (r) r.fl.frequency.linearRampToValueAtTime(260, r.t + 0.4); },
  pen() { for (let i = 0; i < 4; i++) setTimeoutAudio(i * 0.12, () => noiseShot(0.09, 'highpass', 4000, 1, 0.12)); },
  breaker() { noiseShot(0.08, 'highpass', 1200, 0.7, 0.5); tone(70, 0.25, 'sine', 0.4); },
  powerDown() { if (!snd.ok) return; const ac = audio.ac, t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(30, t + 1.2);
    g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.3);
    o.connect(filt('lowpass', 400, 0.7)).connect(g).connect(audio.out); o.start(t); o.stop(t + 1.4); },
  powerUp() { if (!snd.ok) return; const ac = audio.ac, t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(30, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.8);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.06, t + 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
    o.connect(filt('lowpass', 300, 0.7)).connect(g).connect(audio.out); o.start(t); o.stop(t + 1.3); },
  burst(d = 0.4) { noiseShot(d, 'bandpass', 2400, 0.4, 0.3, snd.ok ? snd.radio : null); },
  crackle() { noiseShot(0.12, 'bandpass', 3200, 1.5, 0.2, snd.ok ? snd.radio : null); },
  flashlight() { noiseShot(0.04, 'highpass', 2500, 0.7, 0.3); },
  step() { noiseShot(0.12, 'lowpass', 300, 0.7, 0.25, null, true); },
};
// Audio-side delay: scheduled on the audio clock, presentation only (never gameplay).
function setTimeoutAudio(d, fn) { if (!snd.ok) return; const s = audio.ac.createConstantSource ? audio.ac.createConstantSource() : null;
  if (!s) { fn(); return; } s.onended = fn; s.start(audio.ac.currentTime); s.stop(audio.ac.currentTime + d); }

// Clara's recorded voices: audio/clara/<id>.mp3 or .ogg. A missing file falls back to text.
const vozes = {};
function prepararVozes() {
  const lista = FALAS.gravacoes === 'todas' ? FALAS.clara.map(c => c.id) : (FALAS.gravacoes || []);
  for (const c of FALAS.clara) {
    if (!lista.includes(c.id)) continue; // not listed: text only, and no request at all
    const el = document.createElement('audio'); el.preload = 'auto';
    const v = { el, ok: false, node: null };
    ['mp3', 'ogg'].forEach(ext => {
      const s = document.createElement('source');
      s.src = `audio/clara/${c.id}.${ext}`; s.type = ext === 'mp3' ? 'audio/mpeg' : 'audio/ogg';
      el.appendChild(s);
    });
    el.addEventListener('canplaythrough', () => { v.ok = true; });
    el.addEventListener('error', () => { v.ok = false; }, true);
    vozes[c.id] = v;
  }
}
/** Plays Clara's recording when it exists; returns false so the caller keeps the text voice. */
function tocarVoz(id) {
  const v = vozes[id]; if (!v || !v.ok) return false;
  if (snd.ok && !v.node && location.protocol !== 'file:') { // file:// would silence a filtered element
    try {
      v.node = audio.ac.createMediaElementSource(v.el);
      const ws = audio.ac.createWaveShaper(), curve = new Float32Array(256);
      for (let i = 0; i < 256; i++) { const x = i / 128 - 1; curve[i] = Math.tanh(x * 2.2); }
      ws.curve = curve; v.node.connect(filt('highpass', 300, 0.7)).connect(filt('lowpass', 3400, 0.7)).connect(ws).connect(snd.radio);
    } catch (e) { v.node = null; }
  }
  v.el.currentTime = 0; v.el.muted = muted; const p = v.el.play(); if (p && p.catch) p.catch(() => {});
  return true;
}

// ---- Canvas textures (CCTV, terminal, radio, clipboard, book, badge) ------------------------
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const FW = 192, FH = 144;
const feedC = [0, 1, 2, 3].map(() => mk(FW, FH));
const treesBy = [0, 1, 2, 3].map(i => { const r = seeded(i * 997 + 13), a = [];
  for (let k = 0; k < 16; k++) a.push([r() * FW, 3 + r() * 10, 0.35 + r() * 0.65]); return a.sort((x, y) => x[2] - y[2]); });

/** The hooded figure in a yellow reflective vest, feet at (x, y), s px tall, facing the lens. */
function drawFigure(g, x, y, s) {
  const u = s / 30;
  const poly = (pts, c) => { g.fillStyle = c; g.beginPath(); g.moveTo(x + pts[0] * u, y - pts[1] * u);
    for (let i = 2; i < pts.length; i += 2) g.lineTo(x + pts[i] * u, y - pts[i + 1] * u); g.closePath(); g.fill(); };

  poly([4, 0, 3.2, 11, 0.6, 11, 1.2, 0], dark);
  poly([-5.4, 10, -6.2, 21, -3, 23.6, 3, 23.6, 6.2, 21, 5.4, 10], dark); // coat
  poly([-6.2, 21, -7.6, 10.8, -6.1, 10.2, -5.1, 19], dark);          // arms hanging
  poly([6.2, 21, 7.6, 10.8, 6.1, 10.2, 5.1, 19], dark);
  poly([-5.3, 11.4, -5.8, 20.5, -2.1, 22.6, 0, 16.8, 2.1, 22.6, 5.8, 20.5, 5.3, 11.4], '#e6cf1e'); // vest
  g.fillStyle = '#a8a8a2'; g.fillRect(x - 5.5 * u, y - 15.6 * u, 11 * u, 1.2 * u); g.fillRect(x - 5.4 * u, y - 13.1 * u, 10.8 * u, 1.2 * u);
  g.fillStyle = '#111513'; g.beginPath(); g.ellipse(x, y - 26 * u, 3.9 * u, 4.6 * u, 0, 0, Math.PI * 2); g.fill(); // hood
  poly([-4.6, 21.8, -4, 27, 4, 27, 4.6, 21.8], '#111513');
  g.fillStyle = '#000'; g.beginPath(); g.ellipse(x, y - 25.2 * u, 2.4 * u, 3.1 * u, 0, 0, Math.PI * 2); g.fill(); // face: only dark
}
function feedOverlay(g, ch, opts) {

}

  if (S.place === 'mesa' && S.zoom === 'radio' && !S.zeroOn && tuned(tune.station_bulletin)) { const b = lineAt(bulletin, S.bulletinT); if (b.shown) out.push({ t: b.shown.split('. ').slice(-2).join('. '), c: '#a9c4bb', style: '' }); }
  if (S.thought && S.t - S.thought.at < tune.thought_time) out.push({ t: S.thought.text, c: '#a3adb5', style: 'italic ' });
  return out;
}
function drawSubs(bottom) {
  const subs = subtitles(), size = 28, lh = 36, maxW = Math.min(W - 80, 1000);
  let y = bottom;
  for (let i = subs.length - 1; i >= 0; i--) {
    const s = subs[i], ls = wrap(s.t, maxW, size, s.style);
    const h = ls.length * lh + 14; y -= h;
    ctx.fillStyle = 'rgba(0,0,0,.55)'; let mw = 0; ctx.font = `${s.style}${size}px ${FONT}`; ls.forEach(l => { mw = Math.max(mw, ctx.measureText(l).width); });
    ctx.fillRect(W / 2 - mw / 2 - 14, y, mw + 28, h);
    ls.forEach((l, k) => text(l, W / 2, y + 7 + lh / 2 + k * lh, size, s.c, 'center', s.style));
    y -= 10;
  }
  return y;
}
function drawOptions() {
  const S = state; ui.opts = [];
  if (!S.options) return H - 30;
  const w = Math.min(W - 60, 940), h = 70, x = (W - w) / 2;
  S.options.forEach((o, i) => {
    const y = H - 30 - (S.options.length - i) * (h + 14);
    const r = { x, y, w, h }; ui.opts.push(r);
    ctx.fillStyle = 'rgba(6,14,12,.82)'; ctx.fillRect(x, y, w, h); ctx.strokeStyle = '#6fae96'; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
    const ls = wrap(o, w - 90, 26); ls.forEach((l, k) => text(l, x + 62, y + h / 2 + (k - (ls.length - 1) / 2) * 30, 26, '#d8efe6', 'left'));
    text(String(i + 1), x + 30, y + h / 2, 26, '#6fae96');
  });
  return H - 30 - S.options.length * (h + 14) - 6;
}

// ---- Scenes ------------------------------------------------------------------------------
const figCanvas = mk(96, 128);
const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() { // every figure the prologue draws, side by side, named
      ctx.clearRect(0, 0, W, H); clear('#05070a');
      const cw = W / 3, cy = H / 2 - 30, g = figCanvas.getContext('2d');
      const gr = g.createLinearGradient(0, 0, 0, 128); gr.addColorStop(0, '#28322d'); gr.addColorStop(1, '#0c100e'); g.fillStyle = gr; g.fillRect(0, 0, 96, 128);
      drawFigure(g, 48, 120, 104);
      ctx.imageSmoothingEnabled = false; ctx.drawImage(figCanvas, cw * 0.5 - 120, cy - 160, 240, 320);
      text('A figura (CAM 03)', cw * 0.5, cy + 200, 26, '#d8e6dc');
      ctx.save(); ctx.translate(cw * 1.5, cy); ctx.scale(520, -520); // the vest on the wall
      ctx.fillStyle = '#d8c21a'; ctx.beginPath(); [[-0.19, -0.26], [-0.19, 0.11], [-0.1, 0.25], [-0.05, 0.25], [0, 0.04], [0.05, 0.25], [0.1, 0.25], [0.19, 0.11], [0.19, -0.26]].forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.fill();
      ctx.fillStyle = '#9a9a9a'; ctx.fillRect(-0.195, -0.105, 0.39, 0.035); ctx.fillRect(-0.195, -0.195, 0.39, 0.035); ctx.restore();
      text('Colete refletivo (parede)', cw * 1.5, cy + 200, 26, '#d8e6dc');
      ctx.drawImage(T.badge ? T.badge.c : figCanvas, cw * 2.5 - 144, cy - 96, 288, 192);
      text('Crachá (gaveta)', cw * 2.5, cy + 200, 26, '#d8e6dc');
    },
  },
  title: {
    update() {
      if (taps.length || pressed('Enter') || pressed('Space')) { taps.length = 0; startAudio(); reset(); scene = 'play'; events.push({ type: 'start' }); }
    },
    draw(vt) {
      render3D(vt); ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(0,0,0,.78)'; ctx.fillRect(0, 0, W, H); staticOverlay(0.18, 500);
      const j = vr() < 0.08 ? (vr() - 0.5) * 14 : 0;
      text(FALAS.titulo, W / 2 + j, H * 0.36, Math.min(96, W / 10), '#dfe8e4', 'center', 'bold ');
      if (vr() < 0.1) text(FALAS.titulo, W / 2 + j + 4, H * 0.36 + 2, Math.min(96, W / 10), 'rgba(120,200,170,.35)', 'center', 'bold ');
      CONTROLS.forEach((c, i) => text(c, W / 2, H * 0.56 + i * 38, 24, '#8fa09a'));
      if (Math.floor(vt * 1.4) % 2) text(FALAS.comecar, W / 2, H * 0.84, 30, '#e8f0ec');
    },
  },
  play: {
    update(dt) { advance(dt); },
    draw(vt) {
      render3D(vt); ctx.clearRect(0, 0, W, H);
      const S = state;
      if (S.t - S.transitionAt < 0.4) { ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H); staticOverlay(0.5, 1400); }
      const top = drawOptions(); drawSubs(top);
      if (S.step === 'fim') { ctx.fillStyle = `rgba(0,0,0,${S.fade})`; ctx.fillRect(0, 0, W, H); }
      else drawIcons();
    },
  },
  pause: {
    update() { if (taps.length || pressed('KeyP') || pressed('Escape') || pressed('Enter') || pressed('Space')) { taps.length = 0; scene = 'play'; setPaused(false); } },
    draw(vt) { render3D(vt, true); ctx.clearRect(0, 0, W, H); ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(0, 0, W, H);
      text(FALAS.pausado, W / 2, H / 2 - 30, 48, '#e8f0ec'); text(FALAS.continuar, W / 2, H / 2 + 34, 26, '#8fa09a'); },
  },
  results: {
    update() {
      for (const tp of taps) if (inRect(ui.restart, tp.x / K, tp.y / K)) { scene = 'title'; reset(); }
      taps.length = 0;
      if (pressed('Enter') || pressed('KeyR')) { scene = 'title'; reset(); }
    },
    draw(vt) {
      soundSync(); ctx.clearRect(0, 0, W, H); clear('#000'); staticOverlay(0.06, 160);
      const j = vr() < 0.05 ? (vr() - 0.5) * 10 : 0;
      text(FALAS.titulo, W / 2 + j, H * 0.4, Math.min(90, W / 10), '#dfe8e4', 'center', 'bold ');
      text(FALAS.continua, W / 2, H * 0.52, 34, '#9fb0aa', 'center', 'italic ');
      const w = 300, h = 64; ui.restart = { x: W / 2 - w / 2, y: H * 0.72, w, h };
      ctx.strokeStyle = 'rgba(160,190,180,.5)'; ctx.lineWidth = 2; ctx.strokeRect(ui.restart.x, ui.restart.y, w, h);
      text(FALAS.recomecar, W / 2, ui.restart.y + h / 2, 28, '#c8d8d2');
    },
  },
};
function render3D(vt, frozen) {
  if (!gfx) return;
  const dt = Math.min(0.1, Math.max(0, vt - lastVt)); lastVt = vt;
  gfx.scene.updateMatrixWorld();
  updateCamera(frozen ? 0 : dt, vt);
  applyState(dt, vt);
  feedAcc += dt; if (feedAcc > 1 / 15) { feedAcc = 0; drawTextures(vt); }
  soundSync();
  const r = gfx.renderer;
  if (CHEAP) { r.setRenderTarget(null); r.render(gfx.scene, gfx.cam); }
  else { r.setRenderTarget(gfx.rt); r.render(gfx.scene, gfx.cam); r.setRenderTarget(null); r.render(gfx.postScene, gfx.postCam); }
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; // draw between steps, so the view never judders
  drawFrame();
}
function drawFrame() { scenes[scene].draw(clock.now()); }
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

try { gfx = buildWorld(); } catch (e) { gfx = null; console.warn('WebGL indisponível: ' + e.message); }
addEventListener('resize', fit); fit();
prepararVozes();
reset();
scene = params.get('scene') || 'title';
if (!scenes[scene]) scene = 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
